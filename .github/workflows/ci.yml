name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Start app with Compose
        run: docker compose up -d --build

      - name: Smoke test
        run: |
          sleep 5
          curl -f http://localhost:5003

      - name: Show logs if something failed
        if: failure()
        run: docker compose logs
